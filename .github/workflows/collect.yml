name: collect-market-data

on:
  schedule:
    # Cron is UTC. 12:00 UTC = 8:00am EDT / 7:00am EST (both pre-market).
    - cron: '7 12 * * 1-5'
    # 13:45 UTC = 9:45am EDT (8:45am EST in winter; both work, quote is delayed anyway).
    - cron: '45 13 * * 1-5'
    # 21:30 UTC = 5:30pm EDT / 4:30pm EST (both after the close).
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'premarket or close (blank = auto by ET hour)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run collector
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: python collector/fetch.py

      - name: Commit results
        run: |
          git config user.name "dial-relay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "collect $(date -u +%Y-%m-%dT%H:%M)Z"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
